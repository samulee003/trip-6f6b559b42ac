<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聖誕歐洲手札 2026 · 動態路線</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.2.0/lxgwwenkaitc-regular.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.2.0/lxgwwenkaitc-bold.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --ink:#4a3426; --paper:#f7f0df; --paper2:#efe4c8; --kraft:#c49a6c;
  --hand:'LXGW WenKai TC','Noto Sans CJK TC','PingFang HK','Microsoft JhengHei',sans-serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .2  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --blot:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .25  0 0 0 .5 -.12'/></filter><rect width='100%' height='100%' filter='url(%23b)'/></svg>");
  --row:30px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--hand);color:var(--ink)}
body{background:var(--kraft);background-image:var(--noise),radial-gradient(ellipse at 30% 20%,#d2ab7e 0%,#b88b5c 100%)}
#book{position:absolute;inset:12px 14px;display:flex;isolation:isolate}
#book:before{content:'';position:absolute;inset:0;border-radius:10px;box-shadow:0 6px 10px rgba(60,35,10,.35);z-index:-1;pointer-events:none}
.page{position:relative;background-color:var(--paper);background-image:var(--noise),var(--blot)}
#left{flex:1;border-radius:10px 3px 3px 10px;padding:16px 18px 16px 16px}
#right{width:340px;border-radius:3px 10px 10px 3px;padding:0 16px 0 30px;display:flex;flex-direction:column;
  background-image:var(--noise),repeating-linear-gradient(to bottom,transparent 0 29px,rgba(120,150,190,.32) 29px 30px),linear-gradient(90deg,transparent 20px,rgba(214,90,90,.35) 20px 21.5px,transparent 21.5px)}
#binding{width:22px;background:linear-gradient(90deg,#e8dcc0,#cdbd99 40%,#b9a782 50%,#cdbd99 60%,#e8dcc0);position:relative}
#binding:before{content:'';position:absolute;inset:18px 2px;background:radial-gradient(circle at 50% 50%,#7d6a55 0 3.5px,#efe6d2 4px 5.5px,transparent 6px) 0 0/18px 34px repeat-y}
#mapwrap{position:absolute;inset:16px 18px 16px 16px;border-radius:4px;box-shadow:0 2px 5px rgba(80,50,20,.3);border:6px solid #fffaf0;overflow:hidden}
#map{position:absolute;inset:0;background:#efe6cf}
#map .leaflet-tile-pane{filter:sepia(.55) saturate(.6) hue-rotate(-8deg) brightness(1.07) contrast(.82);opacity:.78}
#map .city-pane{filter:url(#cityink);mix-blend-mode:multiply}
.leaflet-pane.wash-pane{filter:blur(3px)}
#paperover{position:absolute;inset:0;pointer-events:none;z-index:450;background-image:var(--noise),var(--blot);mix-blend-mode:multiply;opacity:.75;box-shadow:inset 0 0 40px rgba(120,80,30,.35)}
.tape{position:absolute;width:96px;height:26px;background:rgba(236,214,150,.72);z-index:800;box-shadow:0 1px 2px rgba(0,0,0,.12);pointer-events:none;
  clip-path:polygon(2% 10%,6% 0,12% 12%,20% 0,30% 8%,40% 0,50% 10%,60% 0,70% 9%,80% 0,90% 10%,96% 0,100% 12%,98% 90%,93% 100%,86% 88%,76% 100%,66% 90%,56% 100%,46% 90%,36% 100%,26% 90%,16% 100%,8% 90%,0 100%)}
#left>.tape{width:72px;height:22px}
.leaflet-container{font-family:var(--hand);background:transparent}
.leaflet-control-attribution{background:rgba(247,240,223,.8)!important;font-family:sans-serif;font-size:9.5px!important}
.leaflet-control-zoom a{font-family:var(--hand);background:#fbf6ea;color:var(--ink);border-color:#c9b48f!important}
/* caption sticky note */
#caption{position:absolute;top:22px;left:66px;z-index:900;width:472px;background:#fff6b8;background-image:var(--noise);padding:12px 16px 10px;transform:rotate(-1.2deg);box-shadow:2px 4px 8px rgba(80,50,10,.28)}
#caption .tape{top:-12px;left:160px;width:100px;height:22px;transform:rotate(2deg);background:rgba(160,200,215,.75)}
#capDate{font-size:24px;font-weight:700;line-height:1.1}
#capDate .wd{font-size:17px;font-weight:400;margin-left:4px}
#capTitle{font-size:17px;margin-top:4px;line-height:1.3}
#capLeg{font-size:14px;margin-top:5px;line-height:1.35;display:flex;align-items:center;gap:6px;min-height:24px;color:#5d4637}
#capLeg svg{flex:none}
#capSum{font-size:14.5px;margin-top:4px;line-height:1.3;display:flex;align-items:center;gap:5px;color:#7a3b20;font-weight:700}
#capSum .clk{flex:none}
.ref{font-style:normal;font-weight:400;font-size:11px;color:#b03a2e;border:1.2px solid rgba(176,58,46,.75);border-radius:3px;padding:0 3px;margin-left:5px;line-height:14px;display:inline-block;vertical-align:1px;background:rgba(255,250,240,.6);white-space:nowrap}
#capNote{font-size:14px;color:#b03a2e;margin-top:2px;min-height:0}
#caption.compact{width:auto;max-width:330px;padding:9px 16px 8px}
#caption.compact #capDate{font-size:21px}#caption.compact #capTitle{font-size:16px}#caption.compact #capLeg{font-size:13.5px;min-height:0;margin-top:2px}
/* overlay (pins, stamps, vehicle) drawn above the map, below the caption */
#ov{position:absolute;inset:0;z-index:460;pointer-events:none;overflow:hidden}
#ovsvg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#ov .abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.pin{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e7685c,#a8302a);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 3px rgba(0,0,0,.35);border:2px solid #fff3e0;pointer-events:auto;cursor:pointer;font-family:var(--hand)}
.stamp{pointer-events:auto;cursor:pointer}
.stamp .perf{background:#fffdf5;border:5px dotted var(--paper2);box-shadow:1px 2px 4px rgba(70,40,10,.35)}
.stamp .inner{border:1.5px solid var(--sc);margin:3px;padding:7px 18px 4px 8px;background:var(--sbg);text-align:left;position:relative;white-space:nowrap}
.stamp .city{font-size:15.5px;font-weight:700;line-height:1.15}
.stamp .city b{display:inline-block;width:19px;height:19px;border-radius:50%;background:var(--sc);color:#fff;font-size:12px;text-align:center;line-height:19px;margin-right:4px;vertical-align:2px}
.stamp .dates{font-size:12.5px;margin-top:2px}
.stamp .hotel{font-size:11px;line-height:1.25;margin-top:2px;color:#6a5444}
.stamp .washi{position:absolute;left:50%;top:-9px;width:64px;height:16px;transform:translateX(-50%) rotate(-3deg);background:var(--washi);opacity:.85;clip-path:polygon(0 8%,5% 0,95% 6%,100% 0,97% 50%,100% 100%,94% 92%,6% 100%,0 92%,3% 50%)}
.stamp.pending .perf{filter:grayscale(1);opacity:.55}
.stamp.here .perf{box-shadow:0 0 0 3px rgba(233,90,80,.5),1px 3px 8px rgba(70,40,10,.45)}
.postmark{position:absolute;right:-18px;top:-16px;width:42px;height:42px;border:2px solid rgba(176,58,46,.8);border-radius:50%;color:rgba(176,58,46,.9);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;background:rgba(255,250,240,.35);line-height:1;text-align:center;opacity:0}
.postmark:before{content:'';position:absolute;inset:3px;border:1px dashed rgba(176,58,46,.6);border-radius:50%}
.doodle{pointer-events:none}
.maplabel{font-family:var(--hand);color:rgba(110,80,50,.75);white-space:nowrap;pointer-events:none;letter-spacing:3px}
.slabel{font-size:13px;white-space:nowrap;color:#4f3a2b;text-shadow:0 0 3px #fbf4e2,0 0 3px #fbf4e2,0 0 2px #fbf4e2;pointer-events:none}
.slabel i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fffaf0;border:1.6px solid #5d4637;margin-right:4px;vertical-align:0}
.airport{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fffaf0;border:1.5px solid #6b5240;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.airport span{position:absolute;left:33px;top:6px;font-size:13px;color:#5d4637;white-space:nowrap;text-shadow:0 0 3px #fbf4e2,0 0 3px #fbf4e2}
.veh{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(3px 7px 5px rgba(40,25,10,.38))}
.vshadow{border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(60,35,15,.42),rgba(60,35,15,0) 70%)}
.puff{border-radius:50%;border:1.5px solid rgba(90,70,55,.55);background:rgba(255,252,244,.92)}
.puff.dust{background:rgba(226,206,168,.85);border-color:rgba(140,110,70,.4)}
.sline{height:3px;border-radius:2px;background:rgba(74,52,38,.55)}
#info{position:absolute;left:0;top:0;z-index:950;max-height:calc(100% - 16px);overflow:auto;display:none;pointer-events:auto;background:#fffaf0;background-image:var(--noise);border-radius:3px;box-shadow:2px 4px 10px rgba(70,40,10,.35);padding:10px 14px 10px;font-size:14.5px;line-height:1.5;width:260px;transform-origin:50% 100%}
#info h3{margin:0 0 4px;font-size:18px}
#info .note{color:#b03a2e;font-size:13.5px;margin-top:4px}
#info .x{position:absolute;right:6px;top:2px;cursor:pointer;font-size:18px;color:#8a7766}
.vbadge{display:flex;align-items:center;gap:3px;background:#fffaf0;border:1.6px solid #7a3b20;border-radius:10px;padding:1px 7px 1px 4px;font-size:13.5px;font-weight:700;color:#7a3b20;white-space:nowrap;box-shadow:1px 2px 3px rgba(70,40,10,.3)}
.receipt{transform-origin:0 0;pointer-events:auto;width:214px;background:#fffdf6;background-image:var(--noise);padding:12px 14px 14px;font-size:13px;line-height:1.35;color:var(--ink);box-shadow:2px 3px 7px rgba(70,40,10,.32);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),95% 100%,90% calc(100% - 6px),85% 100%,80% calc(100% - 6px),75% 100%,70% calc(100% - 6px),65% 100%,60% calc(100% - 6px),55% 100%,50% calc(100% - 6px),45% 100%,40% calc(100% - 6px),35% 100%,30% calc(100% - 6px),25% 100%,20% calc(100% - 6px),15% 100%,10% calc(100% - 6px),5% 100%,0 calc(100% - 6px))}
.receipt .rt{font-size:17px;font-weight:700;text-align:center;letter-spacing:2px}
.receipt .rs{font-size:11.5px;text-align:center;color:#7a6555;border-bottom:1.5px dashed #b9a07a;padding-bottom:4px;margin-bottom:4px}
.receipt .rr{display:flex;gap:4px;white-space:nowrap}
.receipt .rd{color:#8a7766;font-size:12px;flex:none;width:36px}
.receipt .rn{flex:1;white-space:nowrap}
.receipt .rc{flex:none;font-weight:700}
.receipt .rtot{display:flex;justify-content:space-between;border-top:1.5px dashed #b9a07a;margin-top:5px;padding-top:4px;font-size:15px}
.receipt .rtot b{color:#b03a2e;font-size:16px}
.receipt .rh{text-align:right;font-size:12.5px;color:#6b5646}
#info.chain{width:318px;font-size:13.5px;line-height:1.4}
#info.chain h3{font-size:16.5px;padding-right:16px}
#info .ci{display:flex;gap:7px;padding:4px 0;border-bottom:1px dashed #d8c8a8}
#info .cic{flex:none;width:30px;padding-top:2px;display:flex;justify-content:center}
#info .ct{color:#4a3426}
#info .cd{color:#7a3b20;font-size:12.5px}
#info .tot{margin-top:6px;font-weight:700;color:#7a3b20;display:flex;gap:4px;align-items:flex-start}
#info .tot .clk{flex:none;margin-top:2px}
.leaflet-interactive:focus,.leaflet-container path:focus,.leaflet-container svg:focus{outline:none!important}
.snow{position:absolute;z-index:455;pointer-events:none;opacity:.75}
/* right page: everything sits on the 30px ruled lines */
#right h1{font-size:27px;margin:0;font-weight:700;height:60px;line-height:1;padding-top:27px;white-space:nowrap}
#right .sub{font-size:14.5px;color:#6b5646;height:var(--row);line-height:20px;padding-top:7px;white-space:nowrap}
#legend{height:var(--row);display:flex;align-items:flex-end;gap:7px;padding-bottom:3px;font-size:13px;white-space:nowrap}
#legend .it{display:flex;align-items:flex-end;gap:2px}
#legend .it u{text-decoration:none;border-bottom:3px solid var(--c);line-height:15px}
#timeline{flex:none;overflow-y:auto;scrollbar-width:none;scroll-snap-type:y mandatory;position:relative}
#timeline::-webkit-scrollbar{display:none}
.day{display:grid;grid-template-columns:58px 1fr 22px;grid-template-rows:var(--row) var(--row);height:60px;cursor:pointer;position:relative;scroll-snap-align:start;padding-right:2px}
.day>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px;padding-top:7px}
.day .d{font-weight:700;font-size:17px;grid-column:1;grid-row:1}
.day .w{font-size:13px;grid-column:1;grid-row:2;color:#7a6555}
.day .l1{font-size:15px;grid-column:2;grid-row:1}
.day .l2{font-size:15px;grid-column:2;grid-row:2;padding-left:2px}
.day .l1 .ic{display:inline-flex;gap:2px;vertical-align:-4px;margin-right:4px}
.day .l3{font-size:12.5px;grid-column:2/4;grid-row:3;color:#8a4a2a;padding-left:2px;padding-top:8px;letter-spacing:0}
.day .l3 .ref{font-size:10.5px;line-height:12px;padding:0 2px;margin-left:4px}
.day.done .l3{color:#a08470}
.day .chk{grid-column:3;grid-row:1;padding-top:5px;opacity:0}
.day.done .chk{opacity:1}
.day.done{color:#8a7766}
.day.active{background:linear-gradient(100deg,transparent 0 .5%,rgba(255,226,92,.6) 1.5% 98%,transparent 99.5%)}
.day.active:before{content:'';position:absolute;left:-26px;top:9px;width:16px;height:14px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 14'><path d='M1 7 H12 M8 2 L13 7 L8 12' fill='none' stroke='%23b03a2e' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat}
#controls{display:flex;align-items:center;gap:7px;margin-top:auto;padding:6px 0 10px;border-top:1.5px dashed #b9a07a;background:var(--paper)}
#controls button{font-family:var(--hand);font-size:16px;background:#fffaf0;color:var(--ink);border:2px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:2px 10px;cursor:pointer;box-shadow:1px 2px 0 rgba(74,52,38,.35)}
#controls button:hover{background:#ffe9a8}
#controls input[type=range]{flex:1;accent-color:#b0603a;min-width:60px}
#controls select{font-family:var(--hand);font-size:14px;background:#fffaf0;border:1.5px solid var(--ink);border-radius:6px;color:var(--ink)}
#rcmob{display:none}
#preload{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;font-family:var(--hand);white-space:nowrap;pointer-events:none}
#preload b{font-weight:700}
@media (max-width:820px){
  html,body{overflow:auto;height:auto}
  #book{position:relative;inset:auto;flex-direction:column;margin:8px}
  #left{flex:none;height:64vh;border-radius:10px 10px 3px 3px}
  #mapwrap{inset:10px}
  #binding{display:none}
  #right{width:auto;border-radius:3px 3px 10px 10px;height:auto}
  #caption{width:auto;left:10px;right:10px;top:12px;padding:8px 12px 7px}
  #capDate{font-size:20px}#capTitle{font-size:15px}#capLeg{font-size:13px}#capSum{font-size:13px}
  #info.chain{width:calc(100vw - 60px)}
  #rcmob{display:block;position:relative;margin:14px auto 16px;transform:rotate(1.2deg)}
  #right h1{font-size:24px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="cityink" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues=".72 .72 .72 .72 .72 .72 .72 .72 .72 .72 .72 .72 .72 .72 .72 .72 .72 .9 1 .92 .80"/><feFuncG type="table" tableValues=".80 .80 .80 .80 .80 .80 .80 .80 .80 .80 .80 .80 .80 .80 .80 .80 .80 .94 1 .88 .70"/><feFuncB type="table" tableValues=".88 .88 .88 .88 .88 .88 .88 .88 .88 .88 .88 .88 .88 .88 .88 .88 .88 .97 1 .82 .56"/></feComponentTransfer></filter>
</svg>
<div id="book">
  <div id="left" class="page">
    <div id="mapwrap"><div id="map"></div><div id="paperover"></div></div>
    <div class="tape" style="top:6px;left:-12px;transform:rotate(-32deg)"></div>
    <div class="tape" style="top:4px;right:-14px;transform:rotate(30deg)"></div>
    <div class="tape" style="bottom:6px;right:-12px;transform:rotate(-28deg)"></div>
    <div class="tape" style="bottom:8px;left:-12px;transform:rotate(26deg)"></div>
    <div id="caption"><div class="tape"></div><div id="capDate"></div><div id="capTitle"></div><div id="capSum"></div><div id="capLeg"></div><div id="capNote"></div></div>
  </div>
  <div id="binding"></div>
  <div id="right" class="page">
    <h1>聖誕歐洲手札 2026</h1>
    <div class="sub">12/20 – 12/31・兩大兩小（9 歲、6 歲）</div>
    <div class="sub">全程火車＋巴士・11 晚・6 間住宿</div>
    <div id="legend"></div>
    <div id="timeline"></div>
    <div id="controls">
      <button id="btnPlay" title="播放／暫停">暫停</button>
      <button id="btnReplay" title="重播">重播</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
    </div>
  </div>
</div>
